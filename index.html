<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion des photos</title>
<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#1b2433; --muted:#5d6878; --line:#cfd6e0;
  --accent:#2f5bea; --accent-ink:#ffffff; --ok:#17794a; --err:#b3261e;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#10151f; --card:#192030; --ink:#e8ecf3; --muted:#9aa5b8; --line:#2d374b;
    --accent:#6b8cff; --accent-ink:#0b1020; --ok:#4cc38a; --err:#ff8a80; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  min-height:100vh;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:560px;display:flex;flex-direction:column;gap:24px}
h1{font-size:1.8rem;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:1.2rem;margin:0 0 4px}
p.sub{margin:0;color:var(--muted);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
#drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:200px;border:2px dashed var(--line);border-radius:10px;cursor:pointer;
  text-align:center;padding:16px;overflow:hidden;color:var(--muted)}
#drop:hover,#drop.over,#drop:focus-visible{border-color:var(--accent);outline:none}
#drop strong{color:var(--ink)}
#preview{max-width:100%;max-height:300px;border-radius:6px;display:none}
label{display:block;margin:16px 0 6px;font-weight:600;font-size:.95rem}
input[type=text],input[type=email],input[type=password]{width:100%;padding:12px;font:inherit;
  color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;cursor:pointer;color:var(--accent-ink);background:var(--accent);
  border:0;border-radius:8px;padding:12px 16px}
button.full{margin-top:18px;width:100%;padding:14px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
button.small{padding:7px 12px;font-size:.88rem}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:12px;min-height:1.4em;font-size:.95rem}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;
  color:var(--muted);font-size:.9rem}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg)}
.info{flex:1;min-width:0}
.name{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{color:var(--muted);font-size:.85rem}
.actions{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.edit{display:flex;gap:6px;margin-top:2px}
.edit input{padding:8px 10px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Gestion des photos</h1>
    <p class="sub">Ajoute une photo. Pour modifier ou supprimer, connecte-toi plus bas.</p>
  </header>

  <!-- AJOUTER (Create) -->
  <section class="card">
    <div id="drop" tabindex="0" role="button" aria-label="Choisir une photo">
      <img id="preview" alt="Aperçu de la photo">
      <span id="hint"><strong>Clique ici</strong> ou glisse une photo<br>JPG, PNG, WebP — 10 Mo maximum</span>
    </div>
    <input id="file" type="file" accept="image/*" hidden>

    <label for="nom">Nom de la photo</label>
    <input id="nom" type="text" maxlength="100" placeholder="Ex. Coucher de soleil à Ambohimanga">

    <button id="send" class="full" disabled>Envoyer la photo</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </section>

  <!-- GÉRER (Read / Update / Delete) : réservé à l'admin -->
  <section class="card">
    <h2>Gérer les photos</h2>

    <form id="login">
      <p class="sub">Réservé à l’administrateur.</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pwd">Mot de passe</label>
      <input id="pwd" type="password" autocomplete="current-password" required>
      <button class="full" type="submit">Se connecter</button>
      <div id="loginMsg" class="msg" role="status" aria-live="polite"></div>
    </form>

    <div id="admin" hidden>
      <div class="bar"><span id="who"></span><button id="logout" class="ghost small">Déconnexion</button></div>
      <div id="list"></div>
      <div id="listMsg" class="msg" role="status" aria-live="polite"></div>
      <button id="more" class="ghost full" hidden>Charger plus</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://riyunitnqpjzjptotiff.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NxiTer-dCLx80i-0k-duWQ_yPqyUPhC";
const BUCKET = "photos";
const TABLE = "photos";
const MAX_MO = 10;
const PAGE = 20;

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const say = (el, text, cls) => { el.textContent = text; el.className = "msg " + (cls || ""); };

/* ---------- CREATE : envoyer une photo ---------- */
const drop = $("drop"), fileInput = $("file"), preview = $("preview"), hint = $("hint");
const nom = $("nom"), send = $("send"), msg = $("msg");
let current = null;
let loggedIn = false;

function refresh(){ send.disabled = !(current && nom.value.trim()); }

function setFile(f){
  if(!f) return;
  if(!f.type.startsWith("image/")) return say(msg, "Ce fichier n’est pas une image.", "err");
  if(f.size > MAX_MO*1024*1024) return say(msg, "La photo dépasse " + MAX_MO + " Mo.", "err");
  current = f; say(msg, "");
  preview.src = URL.createObjectURL(f);
  preview.style.display = "block"; hint.style.display = "none";
  if(!nom.value) nom.value = f.name.replace(/\.[^.]+$/, "");
  refresh();
}

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fileInput.click(); } });
fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));
nom.addEventListener("input", refresh);

send.addEventListener("click", async () => {
  send.disabled = true; say(msg, "Envoi en cours…");
  try{
    const ext = (current.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
    const path = new Date().toISOString().slice(0,7) + "/" + crypto.randomUUID() + "." + ext;

    const up = await db.storage.from(BUCKET).upload(path, current, { contentType: current.type });
    if(up.error) throw up.error;

    const url = db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    const ins = await db.from(TABLE).insert({ nom: nom.value.trim(), url });
    if(ins.error) throw ins.error;

    say(msg, "Photo envoyée. Merci !", "ok");
    current = null; fileInput.value = ""; nom.value = "";
    preview.style.display = "none"; hint.style.display = "";
    if(loggedIn) loadList(true);
  }catch(err){
    console.error(err);
    say(msg, "L’envoi a échoué : " + (err.message || "erreur inconnue"), "err");
  }
  refresh();
});

/* ---------- AUTH (admin) ---------- */
$("login").addEventListener("submit", async e => {
  e.preventDefault();
  say($("loginMsg"), "Connexion…");
  const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pwd").value });
  if(error) return say($("loginMsg"), "Connexion refusée : " + error.message, "err");
  $("pwd").value = ""; say($("loginMsg"), "");
});
$("logout").addEventListener("click", () => db.auth.signOut());

db.auth.onAuthStateChange((_event, session) => {
  loggedIn = !!session;
  $("login").hidden = loggedIn;
  $("admin").hidden = !loggedIn;
  if(loggedIn){ $("who").textContent = "Connecté : " + session.user.email; loadList(true); }
  else $("list").replaceChildren();
});

/* ---------- READ : liste des photos ---------- */
let offset = 0;

async function loadList(reset){
  const list = $("list"), listMsg = $("listMsg");
  if(reset){ offset = 0; list.replaceChildren(); }
  say(listMsg, "Chargement…");
  const { data, error, count } = await db.from(TABLE)
    .select("id, nom, url, date_ajout", { count: "exact" })
    .order("date_ajout", { ascending: false })
    .range(offset, offset + PAGE - 1);
  if(error) return say(listMsg, "Impossible de charger la liste : " + error.message, "err");

  data.forEach(p => list.appendChild(makeRow(p)));
  offset += data.length;
  $("more").hidden = offset >= count;
  say(listMsg, count === 0 ? "Aucune photo pour le moment." : "");
}
$("more").addEventListener("click", () => loadList(false));

function btn(label, cls, onClick){
  const b = document.createElement("button");
  b.textContent = label; b.className = cls + " small"; b.addEventListener("click", onClick);
  return b;
}

function makeRow(p){
  const row = document.createElement("div"); row.className = "row";
  const img = document.createElement("img"); img.src = p.url; img.alt = p.nom; img.loading = "lazy";
  const info = document.createElement("div"); info.className = "info";
  const name = document.createElement("span"); name.className = "name"; name.textContent = p.nom;
  const date = document.createElement("span"); date.className = "date";
  date.textContent = new Date(p.date_ajout).toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
  info.append(name, date);
  const actions = document.createElement("div"); actions.className = "actions";
  row.append(img, info, actions);

  const showActions = () => actions.replaceChildren(
    btn("Modifier", "ghost", startEdit),
    btn("Supprimer", "danger", remove)
  );

  /* ---------- UPDATE : renommer ---------- */
  function startEdit(){
    const wrap = document.createElement("div"); wrap.className = "edit";
    const input = document.createElement("input"); input.type = "text"; input.maxLength = 100; input.value = p.nom;
    input.setAttribute("aria-label", "Nouveau nom");
    wrap.appendChild(input);
    name.replaceWith(wrap); input.focus(); input.select();

    const cancel = () => { wrap.replaceWith(name); showActions(); };
    const save = async () => {
      const newName = input.value.trim();
      if(!newName) return;
      const { data, error } = await db.from(TABLE).update({ nom: newName }).eq("id", p.id).select();
      if(error || !data.length) return say($("listMsg"), "Modification refusée.", "err");
      p.nom = newName; name.textContent = newName; img.alt = newName;
      say($("listMsg"), "Nom modifié.", "ok"); cancel();
    };
    input.addEventListener("keydown", e => { if(e.key==="Enter") save(); if(e.key==="Escape") cancel(); });
    actions.replaceChildren(btn("Enregistrer", "", save), btn("Annuler", "ghost", cancel));
  }

  /* ---------- DELETE : supprimer ---------- */
  async function remove(){
    if(!confirm("Supprimer définitivement « " + p.nom + " » ?")) return;
    const { data, error } = await db.from(TABLE).delete().eq("id", p.id).select();
    if(error || !data.length) return say($("listMsg"), "Suppression refusée.", "err");

    const path = decodeURIComponent((p.url.split("/object/public/" + BUCKET + "/")[1] || "").split("?")[0]);
    if(path){
      const r = await db.storage.from(BUCKET).remove([path]);
      if(r.error) console.error(r.error);
    }
    row.remove(); offset = Math.max(0, offset - 1);
    say($("listMsg"), "Photo supprimée.", "ok");
  }

  showActions();
  return row;
}
</script>
</body>
</html>
