<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envoyer une photo</title>
<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#1b2433; --muted:#5d6878; --line:#cfd6e0;
  --accent:#2f5bea; --accent-ink:#ffffff; --ok:#17794a; --err:#b3261e;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#10151f; --card:#192030; --ink:#e8ecf3; --muted:#9aa5b8; --line:#2d374b;
    --accent:#6b8cff; --accent-ink:#0b1020; --ok:#4cc38a; --err:#ff8a80; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  min-height:100vh;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:520px}
h1{font-size:1.8rem;margin:0 0 6px;letter-spacing:-.02em}
p.sub{margin:0 0 24px;color:var(--muted);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
#drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:200px;border:2px dashed var(--line);border-radius:10px;cursor:pointer;
  text-align:center;padding:16px;overflow:hidden;color:var(--muted)}
#drop:hover,#drop.over,#drop:focus-visible{border-color:var(--accent);outline:none}
#drop strong{color:var(--ink)}
#preview{max-width:100%;max-height:300px;border-radius:6px;display:none}
label{display:block;margin:18px 0 6px;font-weight:600;font-size:.95rem}
input[type=text]{width:100%;padding:12px;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:8px}
input[type=text]:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{margin-top:20px;width:100%;padding:14px;font:inherit;font-weight:600;cursor:pointer;
  color:var(--accent-ink);background:var(--accent);border:0;border-radius:8px}
button:disabled{opacity:.5;cursor:not-allowed}
#msg{margin-top:14px;min-height:1.4em;font-size:.95rem}
#msg.ok{color:var(--ok)} #msg.err{color:var(--err)}
</style>
</head>
<body>
<main>
  <h1>Envoyer une photo</h1>
  <p class="sub">Choisis une photo, donne-lui un nom, et elle sera ajoutée à la galerie avec la date du jour.</p>

  <div class="card">
    <div id="drop" tabindex="0" role="button" aria-label="Choisir une photo">
      <img id="preview" alt="Aperçu de la photo">
      <span id="hint"><strong>Clique ici</strong> ou glisse une photo<br>JPG, PNG, WebP — 10 Mo maximum</span>
    </div>
    <input id="file" type="file" accept="image/*" hidden>

    <label for="nom">Nom de la photo</label>
    <input id="nom" type="text" maxlength="100" placeholder="Ex. Coucher de soleil à Ambohimanga">

    <button id="send" disabled>Envoyer la photo</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== À REMPLIR (Supabase → Project Settings → API) ======
const SUPABASE_URL = "https://riyunitnqpjzjptotiff.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NxiTer-dCLx80i-0k-duWQ_yPqyUPhC";
const BUCKET = "photos";
const TABLE = "photos";
const MAX_MO = 10;
// ===========================================================

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), preview = $("preview"), hint = $("hint");
const nom = $("nom"), send = $("send"), msg = $("msg");
let current = null;

function say(text, cls){ msg.textContent = text; msg.className = cls || ""; }
function refresh(){ send.disabled = !(current && nom.value.trim()); }

function setFile(f){
  if(!f) return;
  if(!f.type.startsWith("image/")) return say("Ce fichier n’est pas une image.", "err");
  if(f.size > MAX_MO*1024*1024) return say("La photo dépasse " + MAX_MO + " Mo.", "err");
  current = f; say("");
  preview.src = URL.createObjectURL(f);
  preview.style.display = "block"; hint.style.display = "none";
  if(!nom.value) nom.value = f.name.replace(/\.[^.]+$/, "");
  refresh();
}

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fileInput.click(); } });
fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));
nom.addEventListener("input", refresh);

send.addEventListener("click", async () => {
  send.disabled = true; say("Envoi en cours…");
  try{
    const ext = (current.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
    const path = new Date().toISOString().slice(0,7) + "/" + crypto.randomUUID() + "." + ext;

    const up = await db.storage.from(BUCKET).upload(path, current, { contentType: current.type });
    if(up.error) throw up.error;

    const url = db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    const ins = await db.from(TABLE).insert({ nom: nom.value.trim(), url });
    if(ins.error) throw ins.error;

    say("Photo envoyée. Merci !", "ok");
    current = null; fileInput.value = ""; nom.value = "";
    preview.style.display = "none"; hint.style.display = "";
  }catch(err){
    console.error(err);
    say("L’envoi a échoué : " + (err.message || "erreur inconnue"), "err");
  }
  refresh();
});
</script>
</body>
</html>
